services:
  mysql:
    image: mysql:8.4
    container_name: ddia-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ddia
      MYSQL_USER: ddia
      MYSQL_PASSWORD: ddia
    volumes:
      - mysql-data:/var/lib/mysql
  kafka:
    image: apache/kafka:4.1.0
    container_name: ddia-kafka
    ports:
      - "9092:9092"


volumes:
  mysql-data:
